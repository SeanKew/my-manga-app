name: Build Flet APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 升级到 v4，解决旧版弃用问题
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet cloudscraper beautifulsoup4

      # 核心构建步骤
      - name: Build Android APK
        run: |
          # 增加 --verbose 可以在报错时看到更多细节
          flet build apk --no-version-check

      # 升级到 v4，这是报错的核心修复点
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-purifier-release-apk
          # 确保路径匹配 flet 默认输出路径
          path: build/apk/*.apk
          # 设置保留天数，节省你的 GitHub 空间
          retention-days: 7
