name: Build Flet APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码 (升级 v4)
      - uses: actions/checkout@v4

      # 2. 设置 Python 环境 (升级 v5)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 开启缓存加速后续构建

      # 3. 设置 Java 环境 (APK 打包必需)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. 安装 Flutter 环境 (确保 flet build 不报错)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 5. 安装 Python 依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet cloudscraper beautifulsoup4

      # 6. 构建 APK
      - name: Build Android APK
        run: |
          # 加上 --verbose 方便在手机上查看详细日志
          flet build apk --no-version-check --verbose

      # 7. 上传产物 (核心修复：升级 v4)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-purifier-release
          path: build/apk/*.apk
          retention-days: 5
