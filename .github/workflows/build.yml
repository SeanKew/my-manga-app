name: Build Flet APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      # Flet 打包需要 Flutter 环境，此 Action 会自动处理
      - name: Build Android APK
        run: |
          # 使用 flet build 命令生成 APK
          # --no-version-check 是为了防止在 GitHub 环境中因版本检查导致的挂起
          flet build apk --no-version-check

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: manga-purifier-apk
          path: build/apk/*.apk
