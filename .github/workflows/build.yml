name: Build Flet APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码 (使用最新 v4 版本)
      - uses: actions/checkout@v4

      # 2. 设置 Python 环境 (使用最新 v5 版本)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. 设置 Java 环境 (Android 打包必须，使用 JDK 17)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. 显式设置 Flutter 环境 (防止 flet 找不到编译器)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 5. 安装核心依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet cloudscraper beautifulsoup4

      # 6. 执行万能检查脚本 (确保根目录有 main.py 和 requirements.txt)
      - name: Run Environment Check
        run: python check_env.py

      # 7. 构建 Android APK (已删除报错的 --no-version-check)
      - name: Build Android APK
        run: |
          flet build apk main.py --verbose

      # 8. 上传生成的 APK 产物 (使用 v4 版本)
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manga-purifier-release
          path: build/apk/*.apk
          retention-days: 5
