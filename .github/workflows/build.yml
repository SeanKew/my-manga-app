name: Build Flet APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet cloudscraper beautifulsoup4

      - name: Run Environment Check
        run: python check_env.py

      - name: Build Android APK
        run: |
          # 核心修复：添加 --module-name main
          # 删掉了命令末尾多余的文件名，让参数直接指向模块
          flet build apk --module-name main --verbose

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manga-purifier-release
          path: build/apk/*.apk
          retention-days: 5
